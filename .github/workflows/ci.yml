name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Install declared npm version
        shell: bash
        run: |
          npm_spec="$(node -p "require('./package.json').packageManager")"
          npm install --global "$npm_spec"
          expected_version="${npm_spec#npm@}"
          test "$(npm --version)" = "$expected_version"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate backend
        run: npm run validate:backend

      - name: Build
        run: npm run build

      - name: Check diff hygiene
        run: git diff --check
